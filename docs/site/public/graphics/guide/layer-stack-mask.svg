<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">レイヤーとマスクの概念図</title><desc id="desc">1は下のレイヤーと上の描画、描画に付けた円形のマスク。2はマスク内の上の描画だけが見え、下のレイヤーは残る結果。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#6a7587" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#d6dce6"/></pattern><clipPath id="mask-circle"><circle cx="155" cy="165" r="105"/></clipPath><clipPath id="left-board"><rect x="90" y="173" width="310" height="330" rx="18"/></clipPath><clipPath id="right-board"><rect x="570" y="173" width="310" height="330" rx="18"/></clipPath></defs><rect width="960" height="640" fill="white"/><circle cx="214" cy="99" r="29" fill="#252d3a"/><text x="214" y="112" fill="white" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="600" text-anchor="middle">1</text><circle cx="724" cy="99" r="29" fill="#252d3a"/><text x="724" y="112" fill="white" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="600" text-anchor="middle">2</text><rect x="66" y="203" width="310" height="330" rx="18" fill="#f3f5f8" stroke="#d6dce6" stroke-width="2.5"/><rect x="78" y="188" width="310" height="330" rx="18" fill="#e7ebf2" stroke="#d6dce6" stroke-width="2.5"/><rect x="90" y="173" width="310" height="330" rx="18" fill="white" stroke="#d6dce6" stroke-width="2.5"/><g clip-path="url(#left-board)"><g transform="translate(90,173)"><path d="M0 235L310 55M0 290L310 110" stroke="#d6dce6" stroke-width="28"/><g><path d="M27 238 C70 95 100 252 157 165 S221 100 280 52" fill="none" stroke="#245fe8" stroke-width="58" stroke-linecap="round"/></g></g></g><path d="M332 416L377 484" fill="none" stroke="#252d3a" stroke-width="3" stroke-linecap="round"/><rect x="329" y="436" width="108" height="108" rx="12" fill="#252d3a" stroke="#252d3a" stroke-width="2.5"/><circle cx="383" cy="490" r="33" fill="white"/><path d="M463 335L521 335" fill="none" stroke="#6a7587" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="570" y="173" width="310" height="330" rx="18" fill="white" stroke="#d6dce6" stroke-width="2.5"/><g clip-path="url(#right-board)"><g transform="translate(570,173)"><path d="M0 235L310 55M0 290L310 110" stroke="#d6dce6" stroke-width="28"/><g clip-path="url(#mask-circle)"><path d="M27 238 C70 95 100 252 157 165 S221 100 280 52" fill="none" stroke="#245fe8" stroke-width="58" stroke-linecap="round"/></g></g></g><circle cx="725" cy="338" r="105" fill="none" stroke="#aeb8c7" stroke-width="2" stroke-dasharray="7 8"/></svg>