<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">色混ぜの操作前後を示す概念図</title><desc id="desc">1は隣り合う青と灰色。2はブラシで触れた中央の範囲だけ、既存の2色がなじんだイメージ。製品の実出力や性能比較ではない。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#6a7587" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#d6dce6"/></pattern><clipPath id="mix-before"><rect x="77" y="164" width="320" height="320" rx="18"/></clipPath><clipPath id="mix-after"><rect x="563" y="164" width="320" height="320" rx="18"/></clipPath><radialGradient id="mix-falloff"><stop offset="0" stop-color="white"/><stop offset=".6" stop-color="white"/><stop offset="1" stop-color="black"/></radialGradient><mask id="mix-area"><ellipse cx="723" cy="326" rx="158" ry="122" fill="url(#mix-falloff)"/></mask><linearGradient id="mixed"><stop offset="0" stop-color="#245fe8"/><stop offset=".23" stop-color="#245fe8"/><stop offset=".77" stop-color="#bfc8d7"/><stop offset="1" stop-color="#bfc8d7"/></linearGradient></defs><rect width="960" height="640" fill="white"/><circle cx="237" cy="87" r="29" fill="#252d3a"/><text x="237" y="100" fill="white" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="600" text-anchor="middle">1</text><circle cx="723" cy="87" r="29" fill="#252d3a"/><text x="723" y="100" fill="white" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="600" text-anchor="middle">2</text><rect x="77" y="164" width="320" height="320" rx="18" fill="#f3f5f8" stroke="#d6dce6" stroke-width="2.5"/><rect x="563" y="164" width="320" height="320" rx="18" fill="#f3f5f8" stroke="#d6dce6" stroke-width="2.5"/><g clip-path="url(#mix-before)"><rect x="77" y="164" width="160" height="320" fill="#245fe8"/><rect x="237" y="164" width="160" height="320" fill="#bfc8d7"/></g><g clip-path="url(#mix-after)"><rect x="563" y="164" width="160" height="320" fill="#245fe8"/><rect x="723" y="164" width="160" height="320" fill="#bfc8d7"/><rect x="563" y="164" width="320" height="320" fill="url(#mixed)" mask="url(#mix-area)"/></g><path d="M444 326L516 326" fill="none" stroke="#6a7587" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M661 540C677 500 768 501 795 536" fill="none" stroke="#6a7587" stroke-width="3.5" marker-end="url(#arrow)"/><circle cx="726" cy="326" r="49" fill="none" stroke="white" stroke-width="3.5" stroke-dasharray="7 7"/></svg>