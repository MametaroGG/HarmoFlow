<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
<title id="title">Editable Bézier paths</title><desc id="desc">A cobalt curve is drawn between three anchors. Its middle tangent rotates slightly, showing direct path editing. The complete path remains visible as a pale guide.</desc>
<defs>
<filter id="shadow" x="-40%" y="-50%" width="180%" height="220%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="12"/></filter>
<filter id="small-shadow" x="-30%" y="-30%" width="160%" height="180%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="5"/></filter>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f3f5f8"/></linearGradient>
<linearGradient id="side" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8ebf0"/><stop offset="1" stop-color="#cbd2dd"/></linearGradient>
<radialGradient id="ao"><stop offset="0" stop-color="#ffffff"/><stop offset=".455" stop-color="#737b86"/><stop offset=".52" stop-color="#b8bec7"/><stop offset=".64" stop-color="#edf0f4"/><stop offset=".81" stop-color="#ffffff"/><stop offset="1" stop-color="#e1e5eb"/></radialGradient>
<radialGradient id="curvature"><stop offset="0" stop-color="#939ca9"/><stop offset=".455" stop-color="#343c47"/><stop offset=".5" stop-color="#525c6c"/><stop offset=".6" stop-color="#9ba4b2"/><stop offset=".8" stop-color="#aeb6c1"/><stop offset=".945" stop-color="#f8f9fc"/><stop offset="1" stop-color="#ffffff"/></radialGradient>
<radialGradient id="height"><stop offset="0" stop-color="#242a34"/><stop offset=".46" stop-color="#515b6a"/><stop offset=".67" stop-color="#f7f9fd"/><stop offset=".77" stop-color="#ffffff"/><stop offset="1" stop-color="#4d5869"/></radialGradient>
<g id="hf"><path d="M0 0H18V34H52V0H70V86H52V51H18V86H0Z M86 0H144V17H104V36H137V53H104V86H86Z"/></g>
</defs>
<style>
.curve-shape{animation:reshape 7s ease-in-out infinite}
.tangent{animation:tangent 7s ease-in-out infinite;transform-origin:0px 0px}
.draw{stroke-dasharray:800;stroke-dashoffset:0;animation:reshape 7s ease-in-out infinite,draw 7s ease-in-out infinite}
@keyframes reshape{0%,55%,100%{d:path('M122 294C190 294 230 135 334 135C438 135 480 290 597 210')}72%,86%{d:path('M122 294C190 294 232.27 113.38 334 135C435.73 156.62 480 290 597 210')}}
