@keyframes draw{0%,12%{stroke-dashoffset:0;opacity:1}19%{stroke-dashoffset:0;opacity:0}20%{stroke-dashoffset:800;opacity:0}22%{opacity:1}53%,100%{stroke-dashoffset:0;opacity:1}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
